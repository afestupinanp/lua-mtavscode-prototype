name: Build extension

on:
  push:
    branches:
      - dev
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        working-directory: .
        run: npm install

      - name: Build extension
        working-directory: .
        run: npm run compile

      - name: Generate VSCode extension file
        working-directory: .
        run: |
          mkdir bin
          npm run package -o ./bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            ./out
            ./bin